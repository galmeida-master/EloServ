<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EloServ — Redirecionando</title>
  <!-- GitHub Pages: endereços sem âncora são convertidos para o roteamento por âncora (#/rota) do index.html. -->
  <script>(function(){var l=window.location,p=l.pathname,b='/';if(/\.github\.io$/.test(l.hostname)){var s=p.split('/');b='/'+s[1]+'/';p='/'+s.slice(2).join('/');}if(p.length>1&&p.charAt(p.length-1)==='/'){p=p.slice(0,-1);}l.replace(b+'#'+(p||'/')+l.search);})();</script>
</head>
<body>
  <p>Redirecionando para a EloServ… <a href="./">Abrir o início</a></p>
</body>
</html>
