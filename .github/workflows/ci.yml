name: CI e publicação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Lint, testes unitários e E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint + verificação de HTML)
        run: npm run lint

      - name: Testes unitários com cobertura (mínimo 90% em src/domain)
        run: npm run test:unit

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Testes E2E (Chromium + WebKit)
        run: npm run test:e2e

      - name: Publicar relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 14

      - name: Publicar traces das falhas
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: traces-falhas
          path: test-results/
          retention-days: 14

  publicar:
    name: Publicar no GitHub Pages
    needs: testes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Montar site estático
        run: |
          mkdir -p _site
          cp index.html 404.html _site/
          cp -r assets src _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v5
